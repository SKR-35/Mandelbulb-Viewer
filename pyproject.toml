[project]
name = "mandelbulb-viewer"
version = "0.1.0"
description = "Interactive 3D Mandelbulb fractal visualization (in development)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "numba",
    "pillow",
    "matplotlib",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.15"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]
